name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Base install (no `bess` extra) must not require pyomo/GLPK at all.
  # core and pv must both fully pass without it; bess has its own job below.
  test-core-and-pv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -c "import castvalue; print(castvalue.__version__)"
      - run: pytest tests/core tests/pv -v

  test-bess:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GLPK
        run: sudo apt-get update && sudo apt-get install -y glpk-utils
      - run: pip install -e ".[test,bess]"
      - run: pytest tests/bess -v

  build:
    runs-on: ubuntu-latest
    needs: [test-core-and-pv, test-bess]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
