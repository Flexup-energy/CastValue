[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castvalue_bench"
version = "1.3.2"
description = "Open multi-benchmark framework measuring the EUR/MW value of forecasts in energy trading and storage dispatch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "FlexUp GmbH" }]
keywords = ["energy", "forecasting", "bess", "battery-storage", "linear-programming", "day-ahead", "power-markets", "pv", "imbalance", "intraday", "shapley"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
# BESS benchmarks (castvalue.bess.*) need pyomo to build the LP, plus a
# solver binary that pyomo calls out to. The current BESS DAA benchmark uses
# GLPK (`pyo.SolverFactory("glpk", ...)`) — a system binary, not a pip
# package: install it separately (e.g. `conda install -c conda-forge glpk`
# or `apt install glpk-utils`) and point `Optimizer(solverpath_exe=...)` at
# the `glpsol` binary.
bess = ["pyomo>=6.6"]
# scipy is a PV-imbalance *test* dependency only (the HiGHS LP oracle that
# cross-checks the vertex-enumeration solver in tests/pv/imbalance/) — never
# imported from runtime code. pandas is needed only by the BESS DAA golden
# regression test (reads data/master_energy_data_v2.csv) — also test-only.
test = ["pytest>=7", "scipy>=1.10", "pandas>=2.0"]
all = ["castvalue_bench[bess,test]"]

[project.urls]
Homepage = "https://github.com/Flexup-energy/CastValue"
Issues = "https://github.com/Flexup-energy/CastValue/issues"

[tool.setuptools]
py-modules = ["DAA_optimizer"]

[tool.setuptools.packages.find]
where = ["src"]
