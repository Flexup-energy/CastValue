[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castvalue"
version = "1.1.0"
description = "Open backtesting framework measuring the EUR/MW value of DAA price forecasts for BESS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "FlexUp GmbH" }]
keywords = ["energy", "forecasting", "bess", "battery-storage", "linear-programming", "day-ahead", "power-markets"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "pyomo>=6.6",
]

[project.urls]
Homepage = "https://github.com/Flexup-energy/CastValue"
Issues = "https://github.com/Flexup-energy/CastValue/issues"

[tool.setuptools]
py-modules = ["DAA_optimizer"]
